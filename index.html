    <title>UNIMAP</title>
    <script>
      // Legacy hash-link compat: printed QR codes may encode /#/download,
      // /#/single-location/:id, /#/business-profile/:id, or /#/signup.
      // Rewrite to the equivalent BrowserRouter path before the app boots.
      (function() {
        var hash = window.location.hash || "";
        if (hash.indexOf("#/") === 0) {
          var parts = hash.slice(1).split("?");
          var hashPath = parts[0];
          var hashQuery = parts[1] ? "?" + parts[1] : window.location.search || "";
          var known =
            hashPath === "/download" ||
            hashPath.indexOf("/single-location/") === 0 ||
            hashPath.indexOf("/business-profile/") === 0 ||
            hashPath.indexOf("/signup") === 0;
          if (known) {
            window.location.replace(hashPath + hashQuery);
          }
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
